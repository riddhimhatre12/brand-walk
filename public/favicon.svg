<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Luxury Champagne Gold Gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9a7a4c" />
      <stop offset="25%" stop-color="#d4b483" />
      <stop offset="50%" stop-color="#f3e5ab" />
      <stop offset="75%" stop-color="#d4b483" />
      <stop offset="100%" stop-color="#9a7a4c" />
    </linearGradient>
  </defs>

  <!-- Background Circle (Luxury Dark Background) -->
  <circle cx="256" cy="256" r="240" fill="#111111" stroke="url(#goldGradient)" stroke-width="12" />
  
  <!-- Inner Subtle Accent Ring -->
  <circle cx="256" cy="256" r="218" fill="none" stroke="url(#goldGradient)" stroke-width="2" stroke-dasharray="8 12" opacity="0.4" />

  <!-- Monogram Logo Artwork (Sleek Geometric "BW") -->
  <g stroke="url(#goldGradient)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Letter B -->
    <!-- Vertical Spine -->
    <path d="M 116,150 L 116,362" stroke-width="22" />
    
    <!-- Top Loop -->
    <path d="M 116,150 L 166,150 C 211,150 211,246 166,246 L 116,246" />
    
    <!-- Bottom Loop -->
    <path d="M 116,246 L 176,246 C 226,246 226,362 176,362 L 116,362" />

    <!-- Letter W (Interlocking with B) -->
    <path d="M 226,190 L 271,362 L 311,230 L 351,362 L 396,190" />
  </g>
  
  <!-- A subtle luxury star at the top center -->
  <path d="M 256,65 L 260,78 L 273,82 L 260,86 L 256,99 L 252,86 L 239,82 L 252,78 Z" fill="url(#goldGradient)" />
</svg>
